name: 'Pull Request'
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  run-tests:
    name: 🎯 Run Tests (Node ${{ matrix.node }} / TS ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
        typescript: [
            '~5.0.4',
            '~5.1.6',
            '~5.2.2',
            '~5.3.3',
            '~5.4.5',
            '~5.5.4',
            '~5.6.3',
            '~5.7.3',
            '~5.8.3',
            '~5.9.3'
            # 'latest' to reintroduce once TS6 is supported
          ]
    steps:
      - name: ♻️ Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 🚚 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 📌 Install TS at correct version
        run: npm i typescript@${{ matrix.typescript }}

      - name: 🎯 Run tests
        run: npm test

  build-docs:
    name: 🏗️ Build Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: ♻️ Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
